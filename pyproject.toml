[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ggtree-py"
version = "0.1.4"
description = "Grammar of Graphics for Phylogenetic Trees in Python — an R-compatible port of Bioconductor ggtree."
readme = "README.md"
requires-python = ">=3.10"
license = "Artistic-2.0"
authors = [
    {name = "Guangchuang Yu"},
    {name = "Tommy Tsan-Yuk Lam"},
    {name = "Shuangbin Xu"},
]
keywords = [
    "phylogenetics",
    "phylogeny",
    "tree-visualization",
    "ggtree",
    "ggplot2",
    "bioinformatics",
    "evolution",
    "newick",
    "beast",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.22",
]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
polars = ["polars>=0.20"]
dataframe = [
    "pandas>=1.5",
    "polars>=0.20",
    "pyarrow>=12.0",
]
pdf = ["cairosvg>=2.7"]
dev = [
    "pytest>=7.0",
    "pandas>=1.5",
]

[project.urls]
Homepage = "https://github.com/zhanxw/ggtree-py"
Documentation = "https://zhanxw.github.io/ggtree-py/"
Book = "https://zhanxw.github.io/ggtree-py-book/"
Repository = "https://github.com/zhanxw/ggtree-py"
Issues = "https://github.com/zhanxw/ggtree-py/issues"
Changelog = "https://github.com/zhanxw/ggtree-py/blob/main/CHANGELOG.md"
Upstream = "https://github.com/YuLab-SMU/ggtree"

[tool.hatch.build.targets.wheel]
packages = ["ggtree"]

[tool.hatch.build.targets.sdist]
include = [
    "/ggtree",
    "/docs",
    "/examples",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/CONDUCT.md",
]
exclude = [
    "/docs/figures",
    "/examples/output",
]
